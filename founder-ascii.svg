  <!-- Tia Quét Scanline CRT chạy dọc -->
  <g>
    <rect x="4" y="0" width="422" height="14" fill="url(#scanlineGrad)" class="scanline-bar" pointer-events="none" />
  </g>

  <!-- Footer HUD Bar -->
  <line x1="12" y1="486" x2="418" y2="486" stroke="#2D0B16" stroke-width="1" />
  <text x="18" y="500" class="hud-sub">SYS_STATE: AUTONOMOUS CONDUCTOR</text>
  <text x="300" y="500" class="hud-sub">0xPHI_CORE // ACTIVE</text>
</svg>
