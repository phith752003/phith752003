    <text x="38" y="256" class="ascii-line"><tspan fill="#260009">      </tspan><tspan fill="#590014">.............</tspan><tspan fill="#B30024">::</tspan><tspan fill="#590014">. </tspan><tspan fill="#260009"> </tspan><tspan fill="#590014">.::</tspan><tspan fill="#B30024">----:</tspan><tspan fill="#590014">: </tspan><tspan fill="#260009"> </tspan><tspan fill="#590014"> .</tspan><tspan fill="#B30024">::</tspan><tspan fill="#590014">............ .</tspan><tspan fill="#260009">     </tspan></text>
