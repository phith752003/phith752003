    <text x="38" y="346" class="ascii-line"><tspan fill="#260009">              </tspan><tspan fill="#590014">.. .:....:</tspan><tspan fill="#FF1E40">=</tspan><tspan fill="#B30024">--------</tspan><tspan fill="#FF1E40">=</tspan><tspan fill="#B30024">-</tspan><tspan fill="#590014">...... .. </tspan><tspan fill="#260009">             </tspan></text>
    <text x="38" y="357" class="ascii-line"><tspan fill="#260009">                </tspan><tspan fill="#590014">..::.....</tspan><tspan fill="#B30024">--------</tspan><tspan fill="#590014">.....::..</tspan><tspan fill="#260009">                </tspan></text>
    <text x="38" y="368" class="ascii-line"><tspan fill="#260009">                   </tspan><tspan fill="#590014"> :</tspan><tspan fill="#B30024">:</tspan><tspan fill="#590014">....</tspan><tspan fill="#B30024">::::::</tspan><tspan fill="#590014">:...</tspan><tspan fill="#B30024">::</tspan><tspan fill="#590014">.</tspan><tspan fill="#260009">                   </tspan></text>
