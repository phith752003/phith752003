    <text x="38" y="290" class="ascii-line"><tspan fill="#260009">       </tspan><tspan fill="#590014">..............</tspan><tspan fill="#260009"> </tspan><tspan fill="#FF1E40">=+=++++++++=+=</tspan><tspan fill="#590014">...............</tspan><tspan fill="#260009">       </tspan></text>
